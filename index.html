<style>
:root{--bg:#f5f8f4;--surface:#fff;--line:#d6e2d4;--fg:#1d2a1f;--muted:#5f6f61;--green:#05943c;--green-d:#04702e;--accent:#ff7104;--neg:#c4161c;--neg-soft:#fde4e2;--field:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101611;--surface:#172019;--line:#2d3d30;--fg:#e7efe6;--muted:#9aae9c;--green:#1f9e4d;--green-d:#0f6a31;--accent:#ff8a2b;--neg:#ff6b6b;--neg-soft:#3a1618;--field:#1f2b21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101611;--surface:#172019;--line:#2d3d30;--fg:#e7efe6;--muted:#9aae9c;--green:#1f9e4d;--green-d:#0f6a31;--accent:#ff8a2b;--neg:#ff6b6b;--neg-soft:#3a1618;--field:#1f2b21;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(20,40,20,.08)}
.bar{height:5px;background:linear-gradient(90deg,var(--green) 0 30%,var(--accent) 30% 100%)}
.in{padding:28px 28px 24px}
.logo{display:inline-block;background:#fff;border-radius:10px;padding:8px 10px}
.logo img{height:46px;display:block}
h1{font-family:"Nunito",sans-serif;font-weight:900;font-size:22px;margin:18px 0 2px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
label{display:block;font-family:"Nunito",sans-serif;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:16px}
input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);font:600 12px "Nunito Sans",sans-serif;padding:7px 8px;cursor:pointer;border-radius:6px}
.keep{display:flex;gap:8px;align-items:center;color:var(--muted);font:400 13px "Nunito Sans",sans-serif;letter-spacing:0;text-transform:none;margin:-4px 0 18px;cursor:pointer}
.keep input{width:auto;margin:0}
#go{width:100%;border:0;border-radius:10px;background:var(--green);color:#fff;font:800 15px "Nunito",sans-serif;padding:12px;cursor:pointer}
#go:hover{background:var(--green-d)}
#go:disabled{opacity:.7;cursor:wait}
#err{display:none;background:var(--neg-soft);color:var(--neg);border-radius:8px;padding:9px 12px;font-size:13px;margin:0 0 14px}
.foot{border-top:1px solid var(--line);padding:12px 28px;color:var(--muted);font-size:12px}
</style>
</head>

var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
var hex=function(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');};
var unhex=function(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;};

function clear(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);}catch(e){}}
async function derive(user,pass){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,256));
}
async function open(raw){
  var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},k,b64(CT));
  return new TextDecoder().decode(pt);
}
