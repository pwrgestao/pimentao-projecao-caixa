<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><title>Projeção de Caixa Pimentão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: cabeçalho com a marca e a semana, abas de trabalho, tabelas largas com rolagem própria. Identidade O Pimentão: laranja da marca, verde da folha, fundo claro levemente esverdeado. */
:root{
  --bg:#f5f8f4; --surface:#ffffff; --surface2:#edf3ec; --line:#d6e2d4; --fg:#1d2a1f; --muted:#5f6f61;
  --navy:#05943c; --navy-fg:#ffffff; --deep:#04702e; --accent:#ff7104; --accent-soft:#ffe8d6;
  --neg:#c4161c; --neg-soft:#fde4e2; --pos:#05943c; --warn:#a85600; --warn-soft:#fff1dc; --input:#fff6e8; --input-fg:#b34a00;
  --f-ui:"Nunito Sans","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-label:"Nunito","Nunito Sans",system-ui,sans-serif; --f-display:"Nunito","Nunito Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101611; --surface:#172019; --surface2:#1f2b21; --line:#2d3d30; --fg:#e7efe6; --muted:#9aae9c;
  --navy:#1f9e4d; --navy-fg:#ffffff; --deep:#0f6a31; --accent:#ff8a2b; --accent-soft:#3b2412;
  --neg:#ff6b6b; --neg-soft:#3a1618; --pos:#57d189; --warn:#ffb54d; --warn-soft:#3a2a10; --input:#2c2214; --input-fg:#ffb070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101611; --surface:#172019; --surface2:#1f2b21; --line:#2d3d30; --fg:#e7efe6; --muted:#9aae9c;
  --navy:#1f9e4d; --navy-fg:#ffffff; --deep:#0f6a31; --accent:#ff8a2b; --accent-soft:#3b2412;
  --neg:#ff6b6b; --neg-soft:#3a1618; --pos:#57d189; --warn:#ffb54d; --warn-soft:#3a2a10; --input:#2c2214; --input-fg:#ffb070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.side .grp{font-family:var(--f-label);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:none;border-radius:10px;background:transparent;color:var(--fg);padding:9px 12px;font-family:var(--f-label);font-weight:700}
.side button:hover{background:var(--surface2)}
.side button[aria-current="page"]{background:var(--navy);color:var(--navy-fg)}
.side button[aria-current="page"] .badge{background:#fff;color:var(--accent)}
.side .foot{margin-top:8px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;flex-direction:row;overflow-x:auto;padding:6px}.side .grp,.side .foot{display:none}.side button{white-space:nowrap}}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:18px 12px;border-bottom:4px solid var(--accent);position:relative}
header.top::after{content:'';position:absolute;left:0;bottom:-8px;width:120px;height:4px;background:var(--navy);border-radius:0 0 4px 4px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.brand img{height:56px;width:auto;flex:none;background:#fff;border-radius:10px;padding:4px 8px}
.brand .tt{min-width:0}
.brand h1{font-family:var(--f-display);font-size:24px;font-weight:900;letter-spacing:-.01em;margin:0;color:var(--fg);text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.week{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week label{font-family:var(--f-label);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--navy)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.save{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
button.ghost{background:transparent}
button.sm{padding:3px 8px;font-size:12px}
button.danger{color:var(--neg)}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input.in{background:var(--input);color:var(--input-fg);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{font-family:var(--f-label);border:none;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);padding:10px 14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:var(--surface)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;text-align:center}
.status{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-family:var(--f-label);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--accent);background:var(--accent-soft)}
.kpi.bad{border-top-color:var(--neg)}
.kpi.bad .v{color:var(--neg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:800}
.panel h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:800;color:var(--navy)}
.panel .hint{margin:0;color:var(--muted);font-size:13px;max-width:90ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
table.proj th,table.proj td{font-size:13px}
table.proj thead th{background:var(--navy);color:var(--navy-fg);font-weight:600;position:sticky;top:0}
table.proj thead th .wd{display:block;font-family:var(--f-label);font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
table.proj td:first-child,table.proj th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px;white-space:normal}
table.proj thead th:first-child{background:var(--navy)}
table.proj.lado td.rl,table.proj.lado th.rl{background:color-mix(in srgb,var(--surface2) 70%,transparent);border-right:1px solid var(--line)}
table.proj.lado thead tr.sub2 th{font-size:10px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:3px;padding-bottom:3px;background:var(--deep);color:var(--navy-fg)}
table.proj.lado thead tr.sub2 th.rl{background:var(--deep);opacity:.9}
table.proj.lado thead th{position:static}
table.proj.lado thead tr:first-child th:first-child{position:sticky;left:0;z-index:2}
table.proj.lado thead tr.sub2 th:first-child{min-width:0;white-space:nowrap}
div.diasctl{gap:6px;align-items:center}
div.diasctl button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
button.tg{all:unset;cursor:pointer;display:inline-block;width:18px;text-align:center;margin-right:4px;font-size:12px;transition:transform .15s}
button.tg[aria-expanded="false"]{transform:rotate(-90deg)}
button.tg:focus-visible{outline:2px solid #fff;outline-offset:1px;border-radius:3px}
tr.tot button.tg:focus-visible{outline-color:var(--navy)}
tr.sec td{background:var(--accent);color:#fff;font-weight:700;font-family:var(--f-label);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
tr.sec td:first-child{background:var(--accent)}
tr.tot td{font-weight:700;background:var(--surface2)}
tr.tot td:first-child{background:var(--surface2)}
tr.key td{font-weight:700;color:var(--fg)}
tr.saldo td{font-weight:800;background:var(--deep);color:#fff}
tr.saldo td:first-child{background:var(--deep)}
tr.sub td{color:var(--muted);font-size:12px}
td.neg{color:var(--neg)}
tr.saldo td.neg{background:var(--neg);color:#fff}
table.proj.lado tr.saldo td.rl{background:var(--surface2);color:var(--fg);border-top:2px solid var(--deep);border-bottom:2px solid var(--deep)}
table.proj.lado tr.saldo td.rl.neg{color:var(--neg)}
td.zero{color:var(--muted)}
td.flag{background:var(--accent-soft);color:var(--accent);font-weight:700}
td input.cell{width:100px;text-align:right;padding:3px 6px}
th.click{cursor:pointer}
th.sel{box-shadow:inset 0 -3px 0 var(--accent)}
table.list th .ord{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;white-space:nowrap}
table.list th .ord:hover{color:var(--fg)}
table.list th .ord:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:3px}
table.list th .ord .seta{font-size:10px;opacity:.35}
table.list th .ord[data-on] .seta{opacity:1;color:var(--accent)}
table.list th{font-family:var(--f-label);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2)}
table.list td{font-size:13px}
table.list td.txt,table.list th.txt{text-align:left;white-space:normal}
tr.mover td{background:var(--accent-soft)}
tr.atras td{background:var(--warn-soft)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.03em}
.pill.mover{background:var(--accent);color:#fff}
.pill.atras{background:var(--warn);color:#fff}
.pill.aj{background:var(--navy);color:var(--navy-fg)}
.pill.ok{background:var(--surface2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--navy-fg);border-color:var(--navy)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.day{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;background:var(--surface)}
.day .dh{background:var(--accent);color:var(--navy-fg);padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.day .dh b{font-size:14px}
.day .dh span{font-variant-numeric:tabular-nums;font-weight:700}
.day table td{font-size:12.5px;padding:4px 8px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.log{font-size:13px;display:flex;flex-direction:column;gap:4px}
.log .ok{color:var(--pos)} .log .err{color:var(--neg)}
dl.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:13px}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0;font-weight:600}
.edit td{padding:3px 4px}
.edit input,.edit select{width:100%;padding:4px 6px;font-size:12.5px}
.edit td.num input{text-align:right}
button.daytab{display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:6px 12px;line-height:1.25}
button.daytab small{font-weight:600;font-size:11px;color:var(--muted)}
button.daytab[aria-pressed="true"] small{color:inherit;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-fg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
@media (max-width:600px){.days{grid-template-columns:1fr} .brand h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* Ponte entre o dashboard e o Supabase: dados compartilhados e atualizados em tempo real para todos os usuários. */
(function(){
'use strict';
if(location.protocol==='file:'||!window.supabase){return;} // cópia baixada: segue no modo offline do próprio dashboard
var CFG=window.PP_CFG;
var sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pp-auth'}});
window.PP_SB=sb;
var TAB=Math.random().toString(36).slice(2)+Date.now().toString(36);
var state={},cbs={},channel=null,ready=null,canEdit=true;
function sair(){location.replace('index.html');}
function erro(e){var c=(e&&e.code)||'erro';if(c==='42501')c='invalid_argument';return {code:c,message:e&&e.message};}
function snap(col,changes){var m=state[col];var docs=[];m.forEach(function(body,id){docs.push({id:id,data:function(){return body;}});});
  return {docs:docs,docChanges:function(){return changes||[];}};}
function emit(col,changes){(cbs[col]||[]).forEach(function(f){try{f.ok(snap(col,changes));}catch(e){console.error(e);}});}
async function carregar(col){
  var r=await sb.from('docs').select('id,body').eq('col',col);
  if(r.error)throw r.error;
  var m=new Map();r.data.forEach(function(x){m.set(x.id,x.body);});
  var removidos=[];if(state[col])state[col].forEach(function(_,id){if(!m.has(id))removidos.push({type:'removed',doc:{id:id}});});
  state[col]=m;emit(col,removidos);
}
function canal(){
  if(channel)return;var primeira=true;
  channel=sb.channel('pp-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},async function(p){
    var row=(p.new&&p.new.col)?p.new:p.old;if(!row||!row.col||!state[row.col])return;
    if(p.eventType!=='DELETE'&&p.new&&p.new.origem===TAB)return; // eco da própria gravação
    if(p.eventType==='DELETE'){state[row.col].delete(row.id);emit(row.col,[{type:'removed',doc:{id:row.id}}]);return;}
    var r=await sb.from('docs').select('body').eq('col',row.col).eq('id',row.id).maybeSingle();
    if(r.data){state[row.col].set(row.id,r.data.body);emit(row.col,[{type:'modified',doc:{id:row.id}}]);}
  }).subscribe(function(st){
    if(st==='SUBSCRIBED'){if(!primeira)Object.keys(state).forEach(function(c){carregar(c).catch(function(){});});primeira=false;}
  });
}
async function iniciar(){
  var s=await sb.auth.getSession();
  if(!s.data||!s.data.session){sair();return new Promise(function(){});}
  var a=await sb.from('acesso').select('pode_editar').maybeSingle();
  if(!a.data){await sb.auth.signOut();sair();return new Promise(function(){});}
  canEdit=!!a.data.pode_editar;
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')sair();});
  canal();
}
var db={
  collection:function(col){return {onSnapshot:function(ok,fail){
    (cbs[col]=cbs[col]||[]).push({ok:ok,fail:fail});
    carregar(col).catch(function(e){if(fail)fail(erro(e));});
    return function(){cbs[col]=(cbs[col]||[]).filter(function(x){return x.ok!==ok;});};}};},
  doc:function(path){var i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);return {
    set:async function(body){var r=await sb.from('docs').upsert({col:col,id:id,body:body,origem:TAB},{onConflict:'col,id'});if(r.error)throw erro(r.error);
      if(state[col])state[col].set(id,body);},
    delete:async function(){var r=await sb.from('docs').delete().eq('col',col).eq('id',id);if(r.error)throw erro(r.error);
      if(state[col])state[col].delete(id);}};}
};
var user={can:async function(){return canEdit;}};
window.claude={use:async function(n){if(!ready)ready=iniciar();await ready;if(n==='db')return db;if(n==='user')return user;return null;}};
window.PP_SAIR=async function(){try{await sb.auth.signOut();}catch(e){}sair();};
})();
</script>
<script>
(function(){
'use strict';
// ---------------- utilidades ----------------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>(v==null||v==='')?'':(Math.abs(v)<0.005?'–':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const fmt0=v=>(v==null||v==='')?'':(Math.abs(v)<0.5?'–':Math.round(v).toLocaleString('pt-BR'));
const brl=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pnum=s=>{if(typeof s==='number')return s; if(s==null)return NaN; s=String(s).trim().replace(/^R\$\s*/,''); if(!s)return NaN;
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(',')) s=s.replace(',','.'); return parseFloat(s);};
const D=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const I=dt=>dt.toISOString().slice(0,10);
const add=(iso,n)=>{const d=D(iso);d.setUTCDate(d.getUTCDate()+n);return I(d);};
const wd=iso=>{const w=D(iso).getUTCDay();return w===0?7:w;}; // 1=Seg..7=Dom
const day=iso=>+iso.slice(8,10);
const ym=iso=>iso.slice(0,7);
const mStart=iso=>iso.slice(0,8)+'01';
const addM=(iso,n)=>{const d=D(mStart(iso));d.setUTCMonth(d.getUTCMonth()+n);return I(d);};
const lastDay=iso=>{const d=D(addM(iso,1));d.setUTCDate(0);return d.getUTCDate();};
const monday=iso=>add(iso,1-wd(iso));
const br=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const brY=iso=>iso?br(iso)+'/'+iso.slice(0,4):'';
const DN=['','Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DNL=['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const todayIso=()=>{const n=new Date();return I(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())));};
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
function tryLS(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

// ---------------- estado ----------------
const DEF_GRUPOS=['Fornecedores Bahia','Fornecedores CEASA','Fornecedores Avulsos','Frete Bahia','Frete Fortaleza','Embalagens e Materiais','Pró-labore','Salários e Encargos','Extras (freelancer/hora extra)','Combustível','Empréstimos e Financiamentos','Despesas Fixas e Administrativas','Impostos e Taxas','Manutenção','Investimentos','Outros'];
const S={
  geral:{mesesHist:4,fatorFeriado:1,formasIsentas:['BOLETO','CHEQUE','DEBITO EM CONTA'],grupos:DEF_GRUPOS,saldoSemana:{},saldoMes:{},ajRec:{},ajPag:{},saldoReal:{},dinheiro:{},},
  recorrentes:{itens:[]},feriados:{itens:[]},depara:{map:{}},ajustes:{map:{}},excecoes:{itens:[]},manuais:{itens:[]},
  recebidos:{dias:{},arquivos:[]},pagos:{dias:{},arquivos:[]},saldos:{dias:{},arquivos:[]},orcamento:{cmv:0.63,fat:{},compras:{},meses:{}},mov:{},compras:{},controle:{},pagarMeta:{chunks:0},pagarChunks:{},
};
let db=null, canWrite=true, loaded={cfg:false,base:false,pagar:false};
const UI={fold:(()=>{try{return JSON.parse(tryLS('pp_fold')||'{}')||{};}catch(e){return {};}})(),ordTit:(()=>{try{return JSON.parse(tryLS('pp_ordtit')||'null');}catch(e){return null;}})(),tab:tryLS('pp_tab')||'semana',semana:monday(todayIso()),diaSel:null,filtroTit:'todos',diaTit:0,mes:null};

// ---------------- persistência ----------------
const queues={}, timers={};
function persist(path,delay){
  if(!db){clearTimeout(timers._ls);timers._ls=setTimeout(()=>{tryLS('pp_estado',JSON.stringify(snapshotEstado()));setStatus('Alterações guardadas neste navegador · use “Salvar e baixar HTML” para levar o arquivo atualizado');},delay??400);return;}
  if(!canWrite) return;
  clearTimeout(timers[path]);
  timers[path]=setTimeout(()=>{
    const [col,id]=path.split('/');
    const body=JSON.parse(JSON.stringify(docOf(path)));
    queues[path]=(queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>setStatus('Salvo')).catch(e=>{
      if(e&&e.code==='invalid_argument'){canWrite=false;showBanner('Você pode ver a projeção, mas não tem permissão para alterar os dados desta ferramenta.');}
      else if(e&&e.code==='quota_exceeded'){showBanner('O armazenamento da ferramenta está cheio. Remova arquivos antigos de recebimentos ou pagos.');}
      else setStatus('Não foi possível salvar agora ('+(e&&e.code||'erro')+'). Tente de novo.');
    });
  },delay??400);
}
function docOf(path){
  const m={'cfg/geral':S.geral,'cfg/recorrentes':S.recorrentes,'cfg/feriados':S.feriados,'cfg/depara':S.depara,'cfg/ajustes':S.ajustes,
    'cfg/excecoes':S.excecoes,'cfg/manuais':S.manuais,'base/recebidos':S.recebidos,'base/pagos':S.pagos,'base/saldos':S.saldos,'base/pagarMeta':S.pagarMeta};
  if(path.startsWith('pagar/')) return S.pagarChunks[path.split('/')[1]];

function recOcorrencias(a,b,tits){

function recRange(){const ks=Object.keys(S.recebidos.dias||{}).sort();return ks.length?[ks[0],ks[ks.length-1]]:null;}
function projRec(iso){

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  let delim=',';
  const fl=text.split(/\r?\n/,1)[0];
  if(/^sep=/i.test(fl)){delim=fl.slice(4,5)||',';text=text.slice(text.indexOf('\n')+1);}
  else if((fl.match(/;/g)||[]).length>(fl.match(/,/g)||[]).length)delim=';';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function toIso(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){return I(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())));}
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);return I(d);}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return null;
}
async function readFile(file){
  const name=file.name;
  if(/\.xlsx?$/i.test(name)){
    if(!window.XLSX)throw new Error('o leitor de Excel não carregou; exporte o relatório em .csv');
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  }
  const buf=await file.arrayBuffer();
  let text=new TextDecoder('utf-8').decode(buf);
  if(text.includes('\uFFFD'))text=new TextDecoder('windows-1252').decode(buf);
  return parseCSV(text);
}
function tabela(rows){
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='Ident.')&&r.some(c=>String(c).trim()==='Vencimento'));
  if(hi<0)throw new Error('não encontrei o cabeçalho do relatório (colunas “Ident.” e “Vencimento”)');
  const H=rows[hi].map(c=>String(c).trim());
  const col=n=>H.indexOf(n);
  const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
  return {H,col,data};
}

async function importar(files){

      if(ci>=0){
        const u=raw[ci].map(c=>String(c).trim().toUpperCase()),cd=u.indexOf('DATA'),cf=u.indexOf('FORNECEDOR'),cv=u.indexOf('VALOR'),cp=u.indexOf('PAGAMENTO');
        const lin=[];let de=null,ate=null;
        raw.slice(ci+1).forEach(r=>{const d=toIso(r[cd]),f=String(r[cf]||'').trim(),v=pnum(r[cv]);if(!d||!f||isNaN(v))return;
          lin.push([d,f,Math.round(v*100)/100,cp>=0?String(r[cp]||'').trim().toUpperCase():'']);if(!de||d<de)de=d;if(!ate||d>ate)ate=d;});
        if(!lin.length)throw new Error('nenhuma linha com data, fornecedor e valor');
        const ms=new Set(lin.map(x=>ym(x[0])));
        ms.forEach(m=>{const old=((S.controle[m]||{}).linhas||[]).filter(x=>x[0]<de||x[0]>ate);S.controle[m]={linhas:old.concat(lin.filter(x=>ym(x[0])===m))};persist('controle/'+m,100);});
        out.push(`<span class="ok">✓ ${esc(file.name)}: controle de compras de ${brY(de)} a ${brY(ate)} (${lin.length} lançamentos, ${brl(lin.reduce((s,x)=>s+x[2],0))}; período substituído)</span>`);
        continue;
      }
      const {H,col,data}=tabela(raw);
      const get=(r,n)=>{const i=col(n);return i<0?'':r[i];};
      const isRec=H.includes('NSU')||H.includes('Sessão Caixa')||H.includes('Vendedor');
      const pagosN=data.filter(r=>toIso(get(r,'Pagamento'))).length;
      if(isRec||pagosN>data.length*0.5){
        // movimentações realizadas: guardadas uma a uma (Ident. + data), então a mesma movimentação vinda da loja e do atacado conta uma vez só
        const key=isRec?'recebidos':'pagos', kind=isRec?'rec':'pag';
        const fm={},pm={};let de=null,ate=null,n=0;
        data.forEach((r,ix)=>{if(String(get(r,'Situação')).trim()==='Estornada')return;const d=toIso(get(r,'Pagamento'));const v=pnum(get(r,'Pago'));if(!d||isNaN(v))return;
          const id=String(get(r,'Ident.')).trim()||('~'+[get(r,'Participante'),get(r,'Documento'),get(r,'NSU'),get(r,'Pago'),ix].join('~'));
          const k=id+'|'+d; fm[k]=Math.round(((fm[k]||0)+v)*100)/100; if(!isRec){const pl=String(get(r,'Plano Conta')).trim();if(pl)pm[k]=pl;} n++; if(!de||d<de)de=d; if(!ate||d>ate)ate=d;});
        if(!de)throw new Error('nenhuma linha com data de pagamento e valor pago');
        const r=ledgerMerge(kind,fm,de,ate,pm);
        const base=S[key];
        base.arquivos=(base.arquivos||[]).concat([{nome:file.name,de,ate,linhas:n,estab:estabsDe(data,get).join(', '),em:new Date().toISOString().slice(0,19)}]).slice(-30);
        persist('base/'+key,0);
        out.push(`<span class="ok">✓ ${esc(file.name)}: ${isRec?'contas recebidas':'contas pagas'} de ${brY(de)} a ${brY(ate)} · ${r.novas} movimentação(ões) nova(s)${r.repetidas?`, ${r.repetidas} já existiam e não foram duplicadas`:''}</span>`);

          rows.push([id,String(get(r,'Participante')).trim(),venc,Math.round((v||0)*100)/100,String(get(r,'Forma Pagamento')).toUpperCase().trim(),String(get(r,'Plano Conta')).trim(),String(get(r,'Situação')).trim(),String(get(r,'Estabelecimento')).trim()||('arquivo:'+file.name)]);});
        if(!rows.length)throw new Error('nenhum título com Ident. e vencimento');
        // substitui só os títulos do(s) mesmo(s) estabelecimento(s) do arquivo; no mesmo envio, os arquivos se somam; Ident. repetido entra uma vez
        const est=new Set(rows.map(r=>r[7]));
        const atuais=Object.keys(S.pagarChunks).filter(k=>+k.slice(1)<(S.pagarMeta.chunks||0)).sort((a,b)=>+a.slice(1)-+b.slice(1)).flatMap(k=>S.pagarChunks[k].rows||[]);
        const mantem=atuais.filter(r=>r[7]&&(!est.has(r[7])||lote.estabs.has(r[7])));
        const M=new Map();let rep=0;mantem.forEach(r=>M.set(r[0],r));rows.forEach(r=>{if(M.has(r[0]))rep++;M.set(r[0],r);});
        est.forEach(e=>lote.estabs.add(e));
        const all=[...M.values()];
        const CH=400, n=Math.max(1,Math.ceil(all.length/CH)), old=S.pagarMeta.chunks||0;
        S.pagarChunks={};
        for(let i=0;i<n;i++){S.pagarChunks['c'+i]={rows:all.slice(i*CH,(i+1)*CH)};persist('pagar/c'+i,0);}
        if(db&&canWrite)for(let i=n;i<old;i++){const p='pagar/c'+i;queues[p]=(queues[p]||Promise.resolve()).then(()=>db.doc(p).delete()).catch(()=>{});}
        const arqs=((S.pagarMeta.arquivos)||[]).filter(a=>!a.estab||!a.estab.split(', ').some(e=>est.has(e))||lote.nomes.has(a.nome));
        arqs.push({nome:file.name,estab:[...est].join(', '),linhas:rows.length,em:new Date().toISOString().slice(0,19)});lote.nomes.add(file.name);
        S.pagarMeta={chunks:n,arquivo:arqs.map(a=>a.nome).join(' + '),linhas:all.length,em:new Date().toISOString().slice(0,19),arquivos:arqs};
        persist('base/pagarMeta',300);
        const vs=rows.map(r=>r[2]).sort();
        out.push(`<span class="ok">✓ ${esc(file.name)}: contas a pagar com ${rows.length} títulos (${esc([...est].join(', '))}), vencimentos de ${brY(vs[0])} a ${brY(vs[vs.length-1])}${rep?` · ${rep} título(s) já existiam e não foram duplicados`:''} · base agora com ${all.length} títulos</span>`);
      }
    }catch(e){out.push(`<span class="err">✕ ${esc(file.name)}: ${esc(e.message||e)}</span>`);}
  }
  showBanner('');render();const l2=$('#log');if(l2)l2.innerHTML=out.join('');
}

function fatMes(y,m){const r=fatAno(String(y),String(m));if(r!=null)return {v:r,prov:false};
  const xs=[y-3,y-2,y-1].map(a=>fatAno(String(a),String(m))).filter(x=>x!=null);return {v:xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0,prov:true};}
function cmvMes(mk){const o=(O().meses||{})[mk]||{};return o.cmv!=null&&o.cmv!==''?+o.cmv:(+O().cmv||0.63);}
function orcadoMes(mk){const [y,m]=mk.split('-').map(Number);const f=fatMes(y,m);return {fat:f.v,prov:f.prov,cmv:cmvMes(mk),orc:f.v*cmvMes(mk)};}

function comprasPlanilha(mk){const [y,m]=mk.split('-');const a=((O().realizado||{})[y]||{})[String(+m)];return Array.isArray(a)&&a.some(v=>v!=null&&v!=='')?a:null;}

function semanasPadrao(mk){const m=mk+'-01',n=lastDay(m),ws=[];let de=1;
  for(let d=1;d<=n;d++){const iso=mk+'-'+String(d).padStart(2,'0');if(wd(iso)===7||d===n){ws.push({de,ate:d});de=d+1;}}
  if(ws.length>1&&ws[0].ate-ws[0].de<2){ws[1].de=ws[0].de;ws.shift();}
  if(ws.length>1){const l=ws[ws.length-1];if(l.ate-l.de<3){ws[ws.length-2].ate=l.ate;ws.pop();}}
  const rest=ws.length>1?Math.round(6700/(ws.length-1))/100:0;

async function gerarImagem(el){
  if(!window.html2canvas)throw new Error('sem html2canvas');
  const id='cap'+Date.now();el.setAttribute('data-cap',id);
  try{
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,el.scrollWidth+80),
      onclone:doc=>{doc.documentElement.setAttribute('data-theme','light');const c=doc.querySelector('[data-cap="'+id+'"]');if(!c)return;
        c.style.width='max-content';c.style.maxWidth='none';c.style.background='#ffffff';c.style.padding='14px';
        c.querySelectorAll('.scroll').forEach(x=>{x.style.overflow='visible';});
        c.querySelectorAll('th,td').forEach(x=>{x.style.position='static';});
        c.querySelectorAll('[data-noprint]').forEach(x=>x.remove());}});
    return await new Promise(r=>canvas.toBlob(r,'image/png'));
  }finally{el.removeAttribute('data-cap');}
}
function copiarImagem(el,nome){
  if(!el){toast('Nada para copiar.');return;}
  const blobP=gerarImagem(el);
  let ok=false;
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'image/png':blobP})]).then(()=>{ok=true;toast('Imagem copiada — cole no WhatsApp com Ctrl+V');})
        .catch(async()=>{const b=await blobP.catch(()=>null);if(b)baixarArquivo(nome,b);else toast('Não foi possível gerar a imagem.');});
      return;
    }
  }catch(e){}
  blobP.then(b=>baixarArquivo(nome,b)).catch(()=>toast('Não foi possível gerar a imagem.'));
}

function textoResumo(P){
  const C=P.cols;const L=[`*Projeção de caixa — semana ${br(UI.semana)} a ${br(add(UI.semana,6))}*`,'',`Saldo inicial: ${brl(C[0].ini)}`];
  C.forEach(c=>L.push(`${DN[wd(c.d)]} ${br(c.d)}: receb. ${brl(c.recT)} · pag. ${brl(c.pagT)} · saldo ${brl(c.fim)}`));
  const rec=C.reduce((s,c)=>s+c.recT,0),pag=C.reduce((s,c)=>s+c.pagT,0);const min=C.reduce((m,c)=>c.fim<m.fim?c:m,C[0]);
  L.push('',`Total recebimentos: ${brl(rec)}`,`Total pagamentos: ${brl(pag)}`,`Saldo final: ${brl(C[6].fim)}`,`Menor saldo: ${brl(min.fim)} (${DN[wd(min.d)]} ${br(min.d)})`);
  return L.join('\n');
}
function textoDia(c){return [`*Pagamentos Dia ${br(c.d)} (${DNL[wd(c.d)]})* — ${brl(c.itens.reduce((s,x)=>s+x.valor,0))}`,...c.itens.map(x=>`${x.desc} — ${brl(x.valor)} — ${x.forma}`)].join('\n');}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='width:100%;height:160px';const v=$('#view');v.prepend(ta);ta.select();toast('Selecionado — use Ctrl+C para copiar');}}
async function baixarArquivo(nome,blob){
  const dl=await use('downloads');
  if(dl){try{await dl.save({filename:nome,data:blob});toast('Arquivo salvo');return true;}catch(e){if(e&&e.code==='declined')return false;}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('Arquivo baixado: '+nome);return true;}
  catch(e){toast('Este navegador bloqueou o download.');return false;}
}
async function xlsxCliente(P){
  if(!window.XLSX){toast('O gerador de Excel não carregou (precisa de internet na primeira abertura). Recarregue a página.');return;}
  const C=P.cols, wb=XLSX.utils.book_new(), oc=ocultos(), V=C.map(c=>!oc.has(wd(c.d))), CV=C.filter((c,i)=>V[i]);
  const r1=[[`Resumo da projeção de caixa — semana de ${brY(UI.semana)} a ${brY(add(UI.semana,6))}`],[],['',...CV.map(c=>`${br(c.d)} ${DN[wd(c.d)]}`),'Semana'],
    ['Saldo inicial',...CV.map(c=>+c.ini.toFixed(2)),+C[0].ini.toFixed(2)],['(+) Recebimentos previstos',...CV.map(c=>+c.recT.toFixed(2)),+C.reduce((s,c)=>s+c.recT,0).toFixed(2)],
    ['(−) Pagamentos previstos',...CV.map(c=>+c.pagT.toFixed(2)),+C.reduce((s,c)=>s+c.pagT,0).toFixed(2)],['(=) Saldo final do dia',...CV.map(c=>+c.fim.toFixed(2)),+C[6].fim.toFixed(2)],[],['Pagamentos por grupo']];
  grupos().forEach(g=>{const v=C.map(c=>c.g[g]||0);if(v.some(x=>x>0.005))r1.push([g,...v.filter((x,i)=>V[i]).map(x=>+x.toFixed(2)),+v.reduce((a,b)=>a+b,0).toFixed(2)]);});
  const s1=XLSX.utils.aoa_to_sheet(r1);s1['!cols']=[{wch:30},...CV.map(()=>({wch:14})),{wch:15}];
  XLSX.utils.book_append_sheet(wb,s1,'Resumo');
  // lista no formato do exemplo: blocos de 5 colunas lado a lado, 4 por faixa
  const dias=CV.filter(c=>c.itens.length), aoa=[], merges=[];let top=1;
  for(let b=0;b<dias.length;b+=4){const band=dias.slice(b,b+4);const h=Math.max(...band.map(c=>c.itens.length));
    band.forEach((c,j)=>{const c0=1+j*6;(aoa[top]=aoa[top]||[])[c0]=`Pagamentos Dia ${br(c.d)} (${DNL[wd(c.d)]})`;merges.push({s:{r:top,c:c0},e:{r:top,c:c0+4}});
      c.itens.forEach((x,k)=>{const r=top+1+k;aoa[r]=aoa[r]||[];aoa[r][c0]=D(x.data);aoa[r][c0+1]=x.desc;aoa[r][c0+2]=+x.valor.toFixed(2);aoa[r][c0+3]=x.forma;aoa[r][c0+4]=x.plano;});
      const rt=top+1+h;aoa[rt]=aoa[rt]||[];aoa[rt][c0+1]='TOTAL';aoa[rt][c0+2]=+c.itens.reduce((s,x)=>s+x.valor,0).toFixed(2);});
    top+=h+4;}
  for(let i=0;i<aoa.length;i++)aoa[i]=aoa[i]||[];
  const s2=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true,dateNF:'dd/mm/yyyy'});s2['!merges']=merges;
  s2['!cols']=Array.from({length:24},(_,i)=>({wch:[2,11,40,13,16,30][i%6]}));
  Object.keys(s2).forEach(k=>{const c=s2[k];if(k[0]==='!')return;if(c.t==='n'&&typeof c.v==='number')c.z='#,##0.00';if(c.t==='d')c.z='dd/mm/yyyy';});
  XLSX.utils.book_append_sheet(wb,s2,'Pagamentos');
  const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  const fname=`Pagamentos_${br(UI.semana).replace('/','-')}_a_${br(add(UI.semana,6)).replace('/','-')}.xlsx`;
  baixarArquivo(fname,new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

  if(t.id==='pMeses'){S.geral.mesesHist=Math.max(1,Math.min(12,+t.value||4));persist('cfg/geral',0);render();return;}
  if(t.id==='pFator'){S.geral.fatorFeriado=Math.max(0,(+t.value||0)/100);persist('cfg/geral',0);render();return;}
  if(t.id==='pIsentas'){S.geral.formasIsentas=t.value.split(/[,;]/).map(x=>x.trim().toUpperCase()).filter(Boolean);persist('cfg/geral',0);render();return;}
  if(t.id==='file'){importar([...t.files]);t.value='';return;}
}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');importar([...e.dataTransfer.files]);}});

// ---------------- carregamento ----------------
let renderPending=false;
function scheduleRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;
  const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('input,select')&&ae.id!=='file'&&ae.type!=='file'){ /* evita perder o que está sendo digitado */ setTimeout(scheduleRender,800);return;}
  render();});}
function applySnap(col,snap){
  snap.docs.forEach(d=>{const b=d.data();if(!b)return;const v=JSON.parse(JSON.stringify(b));
    if(col==='cfg'){if(d.id==='geral')S.geral=Object.assign({},S.geral,v);else if(S[d.id]!==undefined)S[d.id]=v;}
    else if(col==='base'){if(d.id==='pagarMeta')S.pagarMeta=v;else if(d.id==='recebidos'||d.id==='pagos'||d.id==='saldos')S[d.id]=Object.assign({dias:{},arquivos:[]},v);}
    else if(col==='pagar')S.pagarChunks[d.id]=v;
    else if(col==='compras')S.compras[d.id]=v;
    else if(col==='controle')S.controle[d.id]=v;
    else if(col==='mov')S.mov[d.id]=v;});
  snap.docChanges().forEach(ch=>{if(ch.type==='removed'&&col==='pagar')delete S.pagarChunks[ch.doc.id];});
  loaded[col]=true;scheduleRender();
}
async function boot(){
  render();
  setStatus('Carregando dados…');
  db=await use('db');
  if(!db){
    loaded.base=true;let emb=null,loc=null;
    try{emb=JSON.parse(document.getElementById('estado').textContent);}catch(e){}
    try{loc=JSON.parse(tryLS('pp_estado')||'null');}catch(e){}
    const pick=(emb&&loc)?((loc.salvoEm||'')>(emb.salvoEm||'')?loc:emb):(emb||loc);
    if(pick&&aplicarEstado(pick)){setStatus('Arquivo offline · dados de '+brY((pick.salvoEm||'').slice(0,10))+' · para guardar as mudanças, use “Salvar e baixar HTML”');showBanner('');}
    else showBanner('Sem dados salvos neste arquivo. Importe os relatórios em “Importar e configurar”; depois use “Salvar e baixar HTML” para guardar.');
    render();return;}
  const user=await use('user');
  if(user){try{const c=await user.can('data.write');if(c===false){canWrite=false;showBanner('Visualização somente leitura: você vê a projeção, mas não altera os dados.');}}catch(e){}}
  const onErr=e=>{setStatus('A conexão com os dados caiu ('+(e&&e.code||'erro')+'). Recarregue a página.');};
  db.collection('cfg').onSnapshot(s=>applySnap('cfg',s),onErr);
  db.collection('base').onSnapshot(s=>applySnap('base',s),onErr);
  db.collection('pagar').onSnapshot(s=>applySnap('pagar',s),onErr);
  db.collection('compras').onSnapshot(s=>applySnap('compras',s),onErr);
  db.collection('controle').onSnapshot(s=>applySnap('controle',s),onErr);
  db.collection('mov').onSnapshot(s=>applySnap('mov',s),onErr);
  setStatus('Dados sincronizados · as alterações ficam salvas automaticamente');
}

boot();
})();
</script>
